services:
  free-bt:
    environment:
      TORZNAB_URL: http://jackett:9117/api/v2.0/indexers/all/results/torznab/api
      TORZNAB_API_KEY: ${JACKETT_API_KEY:-}
      TORZNAB_NAME: Jackett 聚合检索
      HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-}
      HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY:-}
      NO_PROXY: '${NO_PROXY:-localhost,127.0.0.1,::1},jackett'
    depends_on:
      - jackett
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    ports:
      - '127.0.0.1:9117:9117'
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: Asia/Shanghai
    volumes:
      - jackett-config:/config
    restart: unless-stopped
volumes:
  jackett-config:
